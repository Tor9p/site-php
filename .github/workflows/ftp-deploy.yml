name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Нужно для отслеживания только измененных файлов

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: d901193x.beget.tech/public_html/task/MyTravelNotes/site/
          # Исключаем служебные файлы и файлы с конфигами:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .env
            README.md